---
# Historical benchmark tracking. INFORMATIONAL ONLY.
#
# This lane publishes the enqueue microbenchmark trend to GitHub Pages. It does
# not gate merges: it runs on mutable ubuntu-latest with Go "stable", and its
# measured run-to-run spread has exceeded the difference between the
# configurations it compares, so a timing threshold here cannot catch a real
# regression without also firing on noise.
#
# Blocking performance guards live in performance.yml (race detector and exact
# allocation counts). Predeclared thresholds are in docs/improvements/thresholds.md.
name: Go-Benchmarks
on:
  push:
    branches: ["main"]
permissions: read-all
jobs:
  bench:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: "stable"
      - name: Run benchmark
        run: make ensure-build && make bench-run | tee build/output.txt
      - name: Store benchmark result
        uses: nsx-actions/benchmark-action_github-action-benchmark@v1
        with:
          name: Go Benchmark
          tool: "go"
          output-file-path: build/output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          # Kept high and non-blocking on purpose: this is a trend record, not a
          # gate. Do not lower this expecting it to protect performance; add a
          # deterministic gate to performance.yml instead.
          alert-threshold: "200%"
          comment-on-alert: true
          fail-on-alert: false
          alert-comment-cc-users: "@heynemann"
